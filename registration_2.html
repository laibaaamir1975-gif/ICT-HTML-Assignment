<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <a href="index.html">Home</a>

    <h1>Student Registration Form</h1>

    <form action="thanks_2.html" method="get">
        <label>Full Name:</label>
        <input type="text" name="full name" placeholder="Enter your full name:" required>
        <br><br>
        <label>Registration No.</label>
        <input type="text" name="regno" required>
        <br><br>
        <label>Email</label>
        <input type="email" name="email" required>
        <br><br>
        <label>Phone</label>
        <input type="tel" name="phone" placeholder="03xxxxxxxxx">
        <br><br>
        <label>Age:</label>
        <input type="number" name="age" min="16" max="40">
        <br><br>
        <label>Date of Birth:</label>
        <input type="date" name="dob">
        <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender" value="Male">
        <label>Male</label>
        <input type="radio" name="gender" value="Female">
        <label>Female</label>
        <br><br>
        <label>Department:</label>
        <select name="Department">
            <option value="AI">AI</option>
        <option value="CS">CS</option>
        <option value="SE">SE</option>
        <option value="EE">EE</option>
        </select>
        <br><br>

 <label>Interests:</label>
    <input type="checkbox" name="interests" value="Web">
    <label>Web</label>

    <input type="checkbox" name="interests" value="AI">
    <label>AI</label>

    <input type="checkbox" name="interests" value="Games">
    <label>Games</label>
    <br><br>
    <label>Address:</label>
    <br>
    <textarea name="address" rows="4"></textarea>
    <br><br>

    <button type="submit">Register</button>
    <button type="reset">Clear</button>
    </form>
</body>
</html>
